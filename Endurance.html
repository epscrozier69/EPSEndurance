<script type="text/plain" id="gs-code">// ===== EPS Joliot Curie - Endurance : script de synchronisation =====
// À coller dans : Google Sheet des élèves > Extensions > Apps Script
const SAVE_SHEET = '_sauvegarde_app';
const RESERVED = [SAVE_SHEET, 'Résultats VMA', 'Résultats Fractionné', 'Synthèse classes'];

function doGet(e) {
  const p = (e && e.parameter) || {};
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let out;
  if (p.action === 'classes') {
    out = { ok: true, classes: ss.getSheets().map(function (s) { return s.getName(); })
      .filter(function (n) { return RESERVED.indexOf(n) < 0; }) };
  } else if (p.action === 'read') {
    const sh = ss.getSheetByName(p.sheet);
    out = sh ? { ok: true, rows: sh.getDataRange().getDisplayValues() }
             : { ok: false, error: 'Onglet introuvable : ' + p.sheet };
  } else {
    out = { ok: true, state: loadState_() };
  }
  return json_(out);
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const data = JSON.parse(e.postData.contents);
    const current = loadState_();
    if (current && data.state && current.updatedAt > data.state.updatedAt) {
      return json_({ ok: false, conflict: true, state: current });
    }
    saveState_(data.state);
    if (data.tables) writeTables_(data.tables);
    return json_({ ok: true, updatedAt: data.state.updatedAt });
  } catch (err) {
    return json_({ ok: false, error: String(err) });
  } finally {
    lock.releaseLock();
  }
}

function loadState_() {
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(SAVE_SHEET);
  if (!sh || sh.getLastRow() === 0) return null;
  const txt = sh.getRange(1, 1, sh.getLastRow(), 1).getValues()
    .map(function (r) { return String(r[0]).substring(1); }).join('');
  try { return JSON.parse(txt); } catch (err) { return null; }
}

function saveState_(state) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(SAVE_SHEET);
  if (!sh) { sh = ss.insertSheet(SAVE_SHEET); sh.hideSheet(); }
  const txt = JSON.stringify(state);
  const rows = [];
  for (let i = 0; i < txt.length; i += 40000) rows.push(['~' + txt.substring(i, i + 40000)]);
  sh.clearContents();
  sh.getRange(1, 1, rows.length, 1).setValues(rows);
}

function writeTables_(tables) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  Object.keys(tables).forEach(function (name) {
    const rows = tables[name];
    const sh = ss.getSheetByName(name) || ss.insertSheet(name);
    sh.clearContents();
    if (!rows || !rows.length) return;
    const w = Math.max.apply(null, rows.map(function (r) { return r.length; }));
    const data = rows.map(function (r) { const x = r.slice(); while (x.length < w) x.push(''); return x; });
    sh.getRange(1, 1, data.length, w).setValues(data);
    sh.getRange(1, 1, 1, w).setFontWeight('bold').setBackground('#4f46e5').setFontColor('#ffffff');
    sh.setFrozenRows(1);
  });
}

function json_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
</script>

<script>
'use strict';
/* =====================================================================
   Constantes
   ===================================================================== */
const DEFAULT_SHEET = 'https://docs.google.com/spreadsheets/d/1TxC2qvopFyqIej-voYN-HquozjlsaNCaDHfSjIOJ_D4/edit?gid=326295564#gid=326295564';
const DEFAULT_TABS = [6, 5, 4, 3].flatMap(n => [1, 2, 3, 4].map(i => n + 'ème' + i));
// URL du script Google (Apps Script) : la renseigner ici évite de la saisir sur chaque appareil
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw9-4SKbr4HdJYdF4JAqsrTOhUvAK_plWzvCruGjs3CdkxWAMmRNILiERsuQSYISIF2_g/exec';
// Onglet contenant tous les élèves du collège (colonnes Nom, Prénom, Classe, Sexe)
const MASTER_TAB = 'Liste des élèves du collège';
// "6EME3" → "6ème3"
const fmtClass = s => { const t = String(s || '').trim(), m = t.match(/^(\d)\s*[eèé]me\s*(\d+)$/i); return m ? m[1] + 'ème' + m[2] : t; };
const classOrder = (a, b) => (parseInt(b) || 0) - (parseInt(a) || 0) || a.localeCompare(b, 'fr', { numeric: true });
const LS_STATE = 'eps_endurance_state_v1';
const LS_CFG = 'eps_endurance_cfg_v1';
const DURS = [18, 36, 90, 180];

// Test VMA (Léger-Boucher) : départ 7 km/h, +1 km/h toutes les 2 min, dernier palier 18 km/h, plots tous les 50 m
const V_START = 7, V_STEP = 1, V_LAST = 18, PAL_DUR = 120, PLOT = 50;
const PALIERS = [];
for (let v = V_START; v <= V_LAST + 1e-9; v += V_STEP) PALIERS.push(v);
const TOTAL_T = PALIERS.length * PAL_DUR;
const PAL_DIST = PALIERS.map(v => v / 3.6 * PAL_DUR);
const CUM_D = PAL_DIST.reduce((a, d, i) => (a.push((a[i - 1] || 0) + d), a), []);
const TOTAL_D = CUM_D[CUM_D.length - 1];

function distAt(t) {
  t = Math.max(0, Math.min(t, TOTAL_T));
  let d = 0;
  for (let i = 0; i < PALIERS.length; i++) {
    const st = i * PAL_DUR;
    if (t >= st + PAL_DUR) d += PAL_DIST[i];
    else { d += (t - st) * PALIERS[i] / 3.6; break; }
  }
  return d;
}
function timeAtDist(D) {
  let d = 0;
  for (let i = 0; i < PALIERS.length; i++) {
    if (D <= d + PAL_DIST[i] + 1e-7) return i * PAL_DUR + (D - d) / (PALIERS[i] / 3.6);

    return { p: n, v: PALIERS[n - 1], vma: PALIERS[n - 1], t, d: Math.round(TOTAL_D) };
  }
  const i = Math.floor(t / PAL_DUR);

  const v = PALIERS[i];

  const vma = within > PAL_DUR / 2 ? v : v - V_STEP / 2;

    else if (j.ok) { lastSync = Date.now(); setSync('ok'); }

    else if (!r || r.updatedAt < state.updatedAt) { pushing = false; await pushRemote(); }

const Snd = {
  ctx: null, master: null,

      case 'end': this.whistle(bus, t, 0.28); this.whistle(bus, t + 0.42, 0.28); this.whistle(bus, t + 0.84, 1.1); break;
      case 'beep': this.beep(bus, t, 880, 0.15); break;

/* Chronologie d'événements sonores (planification précise sur l'horloge audio) */
class Timeline {
  constructor(events, o) {
    this.events = events.slice().sort((a, b) => a.t - b.t);
    this.lead = o.lead || 5; this.end = o.end; this.onTick = o.onTick; this.onEnd = o.onEnd;
    this.paused = false; this.done = false; this.gen = 0;
  }
  start() {
    Snd.init(); if (!Snd.ctx) return;
    this.base = Snd.ctx.currentTime + this.lead;
    this.bus = Snd.bus();
    this.timer = setInterval(() => this.loop(), 80);
    this.loop();
  }
  elapsed() { return this.paused ? this.pausedAt : Snd.ctx.currentTime - this.base; }
  loop() {
    const e = this.elapsed();
    if (!this.paused && !this.done) {
      for (const ev of this.events) {
        if (ev._s) continue;
        if (ev.t > e + 2.5) break;
        ev._s = true;
        if (ev.t < e - 0.3) continue; // événement manqué (appli en arrière-plan)
        if (ev.snd) Snd.play(ev.snd, this.bus, Math.max(Snd.ctx.currentTime, this.base + ev.t));
        if (ev.say) {
          const g = this.gen;
          setTimeout(() => { if (g === this.gen && !this.done) speak(ev.say); }, Math.max(0, (ev.t - e) * 1000));
        }
      }
    }
    if (this.onTick) this.onTick(e);
    if (!this.done && this.end != null && e >= this.end) { this.stop(false); if (this.onEnd) this.onEnd(); }
  }
  pause() {
    if (this.paused || this.done) return;
    this.pausedAt = this.elapsed(); this.paused = true; this.gen++;
    try { this.bus.disconnect(); } catch (e) {}
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    this.events.forEach(ev => { if (ev.t > this.pausedAt) ev._s = false; });
  }
  resume() {
    if (!this.paused) return;
    Snd.init();
    this.base = Snd.ctx.currentTime - this.pausedAt;
    this.bus = Snd.bus(); this.paused = false;
  }
  stop(cancelSpeech = true) {
    this.done = true; this.gen++;
    clearInterval(this.timer);
    try { this.bus.disconnect(); } catch (e) {}
    if (cancelSpeech && 'speechSynthesis' in window) speechSynthesis.cancel();
  }
}

          const p = perfAt(r.t);
          vma.push([cn, st.name, st.sexe, fmtDate(s.date), r.g || s.groups[st.id] || '', s.track, p.p, p.v, Math.round(r.t * 10) / 10, fmtT(r.t), p.d, p.vma, r.ret || 0, r.elim ? 'oui' : '']);
        });
      } else {
        sortedStudents(C).forEach(st => {
          const role = s.roles[st.id]; if (role !== 'C' && role !== 'O') return;
          const vals = (s.valid[st.id] || []).slice(0, s.reps);
          const v = fracVMA(C, s, st.id), pa = byId.get(s.partner[st.id]);
          frac.push([cn, st.name, fmtDate(s.date), role === 'C' ? 'Coureur (1er)' : 'Observateur (1er)', pa ? pa.name : '', s.work, s.rest, s.reps, s.pct, v == null ? '' : v,
            fracDist(v, s.work, s.pct) == null ? '' : fracDist(v, s.work, s.pct), vals.filter(x => x === 1).length, vals.filter(x => x === 0).length,
            vals.map(x => x === 1 ? '✓' : x === 0 ? '✗' : '·').join(' ')]);
        });
      }
    });
    recapRows(C).forEach(({ st, L, F, hist }) => syn.push([cn, st.name, st.sexe, L ? L.vma : '', L ? fmtDate(L.date) : '', L ? L.p : '', L ? L.v : '', L ? fmtT(L.t) : '', L ? L.d : '', hist.map(fmtVMA).join(' → '), F.pct == null ? '' : F.pct]));
  });
  return { 'Résultats VMA': vma, 'Résultats Fractionné': frac, 'Synthèse classes': syn };
}
function exportXLSX(filename, sheets) {
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    sheets.forEach(sh => {
      const ws = XLSX.utils.aoa_to_sheet(sh.rows);
      ws['!cols'] = (sh.rows[0] || []).map((_, i) => ({ wch: Math.min(40, Math.max(6, ...sh.rows.map(r => String(r[i] == null ? '' : r[i]).length)) + 2) }));
      XLSX.utils.book_append_sheet(wb, ws, sh.name.replace(/[\\\/\?\*\[\]:]/g, '-').slice(0, 31));
    });
    XLSX.writeFile(wb, filename + '.xlsx');
  } else {
    const rows = sheets[0].rows;
    const csv = rows.map(r => r.map(c => { const s = String(c == null ? '' : c); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
    download(filename + '.csv', new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    toast('Bibliothèque Excel indisponible (hors ligne) : export CSV compatible Excel');
  }
}

/* =====================================================================
   Tableaux triables
   ===================================================================== */
const cell = (s, h, cls) => ({ s, h, cls });
function sortTable(key, heads, rows, def = { col: 0, dir: 1 }) {
  const st = ui.sort[key] || def;
  const cmpCell = (a, b) => {
    const x = a.cells[st.col] && a.cells[st.col].s, y = b.cells[st.col] && b.cells[st.col].s;
    const ex = x == null || x === '', ey = y == null || y === '';
    if (ex && ey) return 0; if (ex) return 1; if (ey) return -1;
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * st.dir;
    return String(x).localeCompare(String(y), 'fr', { numeric: true, sensitivity: 'base' }) * st.dir;
  };
  const sorted = rows.slice().sort((a, b) => cmpCell(a, b) || String(a.cells[0].s).localeCompare(String(b.cells[0].s), 'fr'));
  return `<div class="tw"><table class="ct"><thead><tr>${heads.map((h, i) => {
    const hh = typeof h === 'string' ? { t: h } : h;
    if (hh.nosort) return `<th class="${hh.cls || ''}">${hh.t}</th>`;
    return `<th class="s ${hh.cls || ''}" data-act="sort" data-key="${esc(key)}" data-col="${i}">${hh.t}<span class="arr">${st.col === i ? (st.dir > 0 ? '▲' : '▼') : '↕'}</span></th>`;
  }).join('')}</tr></thead><tbody>${sorted.length ? sorted.map(r => `<tr>${r.cells.map(c => `<td class="${c.cls || ''}">${c.h != null ? c.h : esc(c.s == null ? '' : c.s)}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${heads.length}" style="text-align:center;color:#667085;padding:18px">Aucune donnée</td></tr>`}</tbody></table></div>`;
}

/* ---------- Séance : Test VMA ---------- */
function viewVMA(C, s) {

  const doneIn = g => studs.filter(st => s.groups[st.id] === g && s.results[st.id]).length;

  const groupRows = studs.map(st => {
    const g = s.groups[st.id] || 'X', r = s.results[st.id], p = r ? perfAt(r.t) : null;

  const resStuds = studs.filter(st => s.results[st.id] || s.groups[st.id] === 'A' || s.groups[st.id] === 'B');
  const resRows = resStuds.map(st => {

      cell(st.name, `<b>${esc(st.name)}</b>`), cell(st.sexe), cell((r && r.g) || s.groups[st.id] || ''),

  return `

function vmaTick(e) {
  const g = id => document.getElementById(id);
  if (!g('lv-time')) return;
  if (e < 0) { g('lv-time').textContent = e > -3.5 ? 'Départ dans ' + Math.ceil(-e) : 'Attention…'; return; }
  const t = Math.min(e, TOTAL_T), i = Math.min(Math.floor(t / PAL_DUR), PALIERS.length - 1);
  g('lv-time').textContent = fmtT(Math.floor(t));
  g('lv-pal').textContent = (i + 1) + ' / ' + PALIERS.length;
  g('lv-v').textContent = PALIERS[i] + ' km/h';
  const nw = WHISTLES.find(w => w.t > t + 0.001);
  g('lv-next').textContent = nw ? fmtNum(nw.t - t, 1) + ' s · ' + nw.d + ' m' : '—';
  g('lv-dist').textContent = Math.round(distAt(t)) + ' m';
  g('lv-bar').style.width = Math.min(100, (t - i * PAL_DUR) / PAL_DUR * 100) + '%';
}
function vmaEvents() {
  const ev = [{ t: -5.8, say: `Palier 1, ${PALIERS[0]} kilomètres heure. Attention au départ.` },
    { t: -3, snd: 'beep' }, { t: -2, snd: 'beep' }, { t: -1, snd: 'beep' }, { t: 0, snd: 'long' }];
  WHISTLES.forEach(w => { if (w.t < TOTAL_T - 0.05) ev.push({ t: w.t, snd: 'whistle' }); });
  for (let i = 1; i < PALIERS.length; i++) {
    const B = i * PAL_DUR;
    ev.push({ t: B + 0.45, snd: 'palier' }, { t: B + 0.95, say: `Palier ${i + 1}, ${PALIERS[i]} kilomètres heure` });
  }
  ev.push({ t: TOTAL_T, snd: 'end' }, { t: TOTAL_T + 1.8, say: 'Fin du test' });
  return ev;
}
function currentVMASession() {
  const C = live && state.classes[live.cls];
  return C ? { C, s: findSession(C, live.sid) } : {};
}
function finishVMARun(msg) {
  const { s } = currentVMASession();
  if (live.tl) live.tl.stop(false);
  if (s) s.runs[live.group] = true;
  live = null; keepAwake(false);
  commit(); toast(msg, 4000);
}
function vmaStopRunner(id, elim) {
  const { s } = currentVMASession(); if (!s || !live.tl) return;
  const t = live.tl.elapsed(); if (t < 0) { toast('Le test n\'a pas encore commencé'); return; }
  s.results[id] = { t: Math.round(Math.min(t, TOTAL_T) * 10) / 10, g: live.group, ret: live.retards[id] || 0, elim: !!elim };
  if (live.runners.every(r => s.results[r])) { finishVMARun('✅ Tous les élèves du groupe ' + live.group + ' ont terminé. Bande son arrêtée.'); return; }
  commit();
}

  const studRows = studs.map(st => {

    return { cells: [

        <label class="lbl">Temps de récupération</label><div class="chips">${DURS.map(d => `<button class="chip ${s.rest === d ? 'on' : ''}" data-act="fracSet" data-k="rest" data-v="${d}">${fmtDur(d)}</button>`).join('')}</div>

          <div><label class="lbl">Répétitions</label><div class="stepper"><button class="btn" data-act="fracReps" data-v="-1">−</button><b>${s.reps}</b><button class="btn" data-act="fracReps" data-v="1">＋</button></div></div>
          <div><label class="lbl">Intensité</label><select data-chg="fracPct">${[70, 75, 80, 85, 90, 95, 100, 105, 110, 115, 120].map(p => `<option value="${p}" ${s.pct === p ? 'selected' : ''}>${p} % VMA</option>`).join('')}</select></div>
        </div>
      </div>
      ${recap}
    </div>
    <details><summary>Distances pour chaque durée (18", 36", 1'30, 3')</summary>

      <button class="btn sm" data-act="fracSwap">⇄ Inverser les rôles</button>
      <button class="btn sm" data-act="fracAllRole" data-v="X">Tout effacer</button>
    </div>

    ${sortTable('fst-' + s.id, ['Nom Prénom', 'Sexe', 'VMA', 'Rôle', 'Binôme', 'Objectif / course'], studRows)}
  </section>

  <section class="card" id="livecard">

function fracEvents(s) {
  const W = s.work, R = s.rest, N = s.reps, ev = [];
  ev.push({ t: -5.8, say: `${N} fois ${durSay(W)}. Attention.` }, { t: -3, snd: 'beep' }, { t: -2, snd: 'beep' }, { t: -1, snd: 'beep' });
  for (let i = 0; i < N; i++) {
    const st = i * (W + R);
    ev.push({ t: st, snd: 'long' });
    if (i > 0) {
      ev.push({ t: st - 3, snd: 'beep' }, { t: st - 2, snd: 'beep' }, { t: st - 1, snd: 'beep' });
      if (R >= 10) ev.push({ t: st - 6, say: `Répétition ${i + 1}` });
    }
    const en = st + W;
    if (i < N - 1) { ev.push({ t: en, snd: 'double' }); if (R >= 10) ev.push({ t: en + 1.2, say: 'Récupération' }); }
    else ev.push({ t: en, snd: 'end' }, { t: en + 2, say: 'Fin de la série' });
  }
  return ev;
}
function fracTick(e) {
  const g = id => document.getElementById(id);
  if (!g('lv-time') || !live || live.kind !== 'frac') return;
  const { s } = currentVMASession(); if (!s) return;
  const W = s.work, R = s.rest, N = s.reps, cyc = W + R, box = g('live');
  if (live.tl.paused) g('lv-phase').textContent = 'PAUSE';
  if (e < 0) {
    g('lv-time').textContent = e > -3.5 ? String(Math.ceil(-e)) : 'Prêts…';
    if (!live.tl.paused) g('lv-phase').textContent = 'PRÊTS';
    box.className = 'live'; return;
  }
  let i = Math.floor(e / cyc), within = e - i * cyc;
  if (i >= N || (i === N - 1 && within >= W)) { g('lv-time').textContent = '0'; g('lv-phase').textContent = 'TERMINÉ'; box.className = 'live'; g('lv-bar').style.width = '100%'; return; }
  const work = within < W, rem = work ? W - within : cyc - within;
  if (!live.tl.paused) g('lv-phase').textContent = work ? '🏃 COURSE' : '😮‍💨 RÉCUPÉRATION';
  g('lv-rep').textContent = 'Répétition ' + (work ? i + 1 : i + 2) + ' / ' + N;
  g('lv-time').textContent = rem >= 60 ? fmtT(Math.ceil(rem)) : String(Math.ceil(rem));
  g('lv-bar').style.width = ((work ? within / W : (within - W) / R) * 100) + '%';
  g('lv-tot').textContent = fmtT(e);
  box.className = 'live ' + (work ? 'work' : 'rest');
}

const curClass = () => state.classes[ui.tab];
const curSession = () => { const C = curClass(); if (!C) return null; const u = clsUI(C.name); return u.sid ? findSession(C, u.sid) : null; };

const ACT = {
  tab(el) { ui.tab = el.dataset.id; render(); window.scrollTo(0, 0); },
  sub(el) { clsUI(ui.tab).sub = el.dataset.v; render(); },
  sort(el) {
    const k = el.dataset.key, c = +el.dataset.col, st = ui.sort[k] || { col: 0, dir: 1 };
    ui.sort[k] = st.col === c ? { col: c, dir: -st.dir } : { col: c, dir: 1 };
    render();
  },
  syncNow() {
    if (!cfg.scriptUrl) { toast('Renseignez d\'abord l\'URL du script dans l\'onglet Général'); ui.tab = 'general'; render(); return; }
    pullRemote();
  },
  /* --- Général --- */
  async loadTabs(el, silent) {
    if (!cfg.scriptUrl) { ui.avail = cfg.tabs; render(); return; }
    try {
      const all = await loadMaster();
      const list = [...new Set(all.map(s => s.classe).filter(Boolean))];
      ui.avail = list.length ? list.sort(classOrder) : DEFAULT_TABS.slice();
      if (ui.tab === 'general') render();
      if (!silent) toast(ui.avail.length + ' classe(s) trouvée(s)');
    } catch (e) { ui.avail = DEFAULT_TABS.slice(); if (ui.tab === 'general') render(); toast('⚠ Lecture des classes impossible : ' + e.message, 5000); }
  },
  addTab() {
    const v = ($('#newTab').value || '').trim(); if (!v) return;
    if (!cfg.tabs.includes(v)) cfg.tabs.push(v);
    if (ui.avail && !ui.avail.includes(v)) ui.avail.push(v);
    saveCfg(); ui.picked.add(v); render();
  },
  pickAll() { (ui.avail || cfg.tabs).forEach(n => ui.picked.add(n)); render(); },
  async importPicked() {
    if (!ui.picked.size) { toast('Cochez au moins une classe'); return; }
    ui.busy = true; render();
    const msgs = [];
    for (const name of [...ui.picked]) {
      try {
        const studs = await classStudents(name);
        if (!studs.length) { msgs.push(name + ' : aucun élève trouvé'); continue; }
        const r = mergeClass(name, studs);
        msgs.push(`${name} : ${r.total} élèves${r.added !== r.total ? ' (+' + r.added + ')' : ''}`);
      } catch (e) { msgs.push(name + ' : ' + e.message); }
    }
    ui.busy = false; ui.picked.clear();
    commit(); toast(msgs.join(' · '), 6000);
  },
  delClass(el) {
    const c = el.dataset.id;
    if (live && live.cls === c) { toast('Chrono en cours dans cette classe'); return; }
    if (!confirm(`Supprimer la classe ${c} et toutes ses séances ?`)) return;
    delete state.classes[c]; state.classOrder = state.classOrder.filter(x => x !== c);
    commit();
  },
  async testScript() {
    if (!cfg.scriptUrl) { toast('Collez l\'URL du script'); return; }
    try {
      const j = await getJSON(cfg.scriptUrl + '?action=classes&t=' + Date.now());
      if (!j.ok) throw new Error(j.error);
      toast('✅ Connexion OK — ' + j.classes.length + ' onglet(s) : ' + j.classes.join(', '), 5000);
    } catch (e) { toast('⚠ ' + e.message, 6000); }
  },
  copyCode() {
    const code = $('#gs-code').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => toast('Code copié ✔'), () => toast('Sélectionnez le code et copiez-le manuellement'));
  },
  exportAll() {
    const t = buildSheetTables();
    exportXLSX('Endurance_resultats_' + todayISO(), Object.keys(t).map(k => ({ name: k, rows: t[k] })));
  },
  backup() { download('Endurance_sauvegarde_' + todayISO() + '.json', new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' })); },
  /* --- Classe --- */
  toggleNew() { const u = clsUI(ui.tab); u.newOpen = !u.newOpen; render(); },
  createSession(el) {
    const C = curClass(), u = clsUI(C.name), date = ($('#newDate') && $('#newDate').value) || todayISO();
    const base = { id: uid(), date, createdAt: Date.now() };
    const s = el.dataset.v === 'vma'
      ? Object.assign(base, { type: 'vma', track: 150, groups: {}, startGroup: 'A', results: {}, runs: {} })
      : Object.assign(base, { type: 'frac', work: 36, rest: 36, reps: 6, pct: 100, roles: {}, partner: {}, vmaOv: {}, valid: {} });
    C.sessions.push(s); u.sid = s.id; u.newOpen = false;
    commit(); window.scrollTo(0, 0);
  },
  openSession(el) { clsUI(ui.tab).sid = el.dataset.id; render(); window.scrollTo(0, 0); },
  back() { clsUI(ui.tab).sid = null; render(); },
  delSession(el) {
    const C = curClass(), id = el.dataset.id;
    if (live && live.sid === id) { toast('Arrêtez d\'abord le chrono'); return; }
    if (!confirm('Supprimer cette séance et ses résultats ?')) return;
    C.sessions = C.sessions.filter(s => s.id !== id);
    clsUI(C.name).sid = null; commit();
  },
  stSexe(el) { const st = curClass().students.find(x => x.id === el.dataset.id); st.sexe = el.dataset.v; commit(); },
  newSexe(el) { document.querySelectorAll('#newStSexe button').forEach(b => b.classList.toggle('on', b === el)); },
  addStudent() {
    const name = ($('#newStName').value || '').trim(); if (!name) { toast('Saisissez le nom'); return; }
    const sx = document.querySelector('#newStSexe button.on');
    curClass().students.push({ id: uid(), name, classe: ui.tab, sexe: sx ? sx.dataset.v : '' });
    commit();
  },
  delStudent(el) {
    const C = curClass(), st = C.students.find(x => x.id === el.dataset.id);
    if (!confirm(`Retirer ${st.name} de la classe ? (ses résultats seront masqués)`)) return;
    C.students = C.students.filter(x => x.id !== st.id); commit();
  },
  testSound() {
    Snd.init(); unlockSpeech(); if (!Snd.ctx) return;
    const b = Snd.bus(), t = Snd.ctx.currentTime + 0.1;
    Snd.play('whistle', b, t); Snd.play('palier', b, t + 0.7);
    setTimeout(() => speak(`Palier 1, ${PALIERS[0]} kilomètres heure`), 1300);
  },
  /* --- VMA --- */
  setTrack(el) { curSession().track = +el.dataset.v; commit(); },
  setGroup(el) { const s = curSession(); if (el.dataset.v === 'X') delete s.groups[el.dataset.id]; else s.groups[el.dataset.id] = el.dataset.v; commit(); },
  groupsAlt() { const s = curSession(); sortedStudents(curClass()).forEach((st, i) => s.groups[st.id] = i % 2 ? 'B' : 'A'); commit(); },
  groupsAll(el) { const s = curSession(), v = el.dataset.v; curClass().students.forEach(st => { if (v === 'X') delete s.groups[st.id]; else s.groups[st.id] = v; }); commit(); },
  setStartGroup(el) { curSession().startGroup = el.dataset.v; commit(); },
  printFiches(el) { printFiches(curClass(), curSession(), el.dataset.v); },
  prepareVMA(el) {
    if (live) { toast('Un chrono est déjà en cours'); return; }
    const C = curClass(), s = curSession(), g = el.dataset.v;
    const members = sortedStudents(C).filter(st => s.groups[st.id] === g);
    if (!members.length) { toast('Aucun élève dans le groupe ' + g); return; }
    let runners = members.filter(st => !s.results[st.id]);
    if (!runners.length) {
      if (!confirm(`Tous les élèves du groupe ${g} ont déjà un résultat. Effacer leurs résultats et recommencer ?`)) return;
      members.forEach(st => delete s.results[st.id]); runners = members; commit({ render: false });
    }
    live = { kind: 'vma', cls: C.name, sid: s.id, group: g, runners: runners.map(st => st.id), retards: {}, tl: null };
    render();
    const lc = $('#livecard'); if (lc) lc.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  liveCancel() { live = null; render(); },
  vmaGo() {
    unlockSpeech();
    live.tl = new Timeline(vmaEvents(), { lead: 6, end: TOTAL_T + 0.3, onTick: vmaTick, onEnd: () => {
      const { s } = currentVMASession();
      if (s) live.runners.forEach(id => { if (!s.results[id]) s.results[id] = { t: TOTAL_T, g: live.group, ret: live.retards[id] || 0, elim: false }; });
      finishVMARun('🏁 Fin du test : dernier palier terminé.');
    } });
    live.tl.start(); keepAwake(true); render();
  },
  vmaStop(el) { vmaStopRunner(el.dataset.id, false); },
  vmaRetard(el) {
    const id = el.dataset.id;
    if (!live.tl) { toast('Le test n\'a pas commencé'); return; }
    live.retards[id] = (live.retards[id] || 0) + 1;
    if (live.retards[id] >= 2) { vmaStopRunner(id, true); toast('2 retards consécutifs : élève arrêté'); }
    else render();
  },
  vmaOk(el) { live.retards[el.dataset.id] = 0; render(); },
  vmaUndo(el) { const { s } = currentVMASession(); delete s.results[el.dataset.id]; live.retards[el.dataset.id] = 0; commit(); },
  vmaAbort() {
    if (!confirm('Arrêter le test maintenant ?')) return;
    const { s } = currentVMASession(), t = live.tl.elapsed();
    if (t > 0 && confirm('Enregistrer la performance des élèves encore en course (temps actuel : ' + fmtT(t) + ') ?'))
      live.runners.forEach(id => { if (!s.results[id]) s.results[id] = { t: Math.round(Math.min(t, TOTAL_T) * 10) / 10, g: live.group, ret: live.retards[id] || 0, elim: false }; });
    live.tl.stop(); finishVMARun('Test arrêté.');
  },
  vmaEdit(el) {
    const C = curClass(), s = curSession(), st = C.students.find(x => x.id === el.dataset.id), r = s.results[st.id];
    const v = prompt(`Temps de course de ${st.name} (min:s, ex. 9:35). Laisser vide pour effacer.`, r ? fmtT(r.t) : '');
    if (v === null) return;
    if (!v.trim()) { delete s.results[st.id]; commit(); return; }
    const m = v.trim().match(/^(\d+)(?:[:'h ,.](\d{1,2}))?$/);
    if (!m) { toast('Format attendu : min:s'); return; }
    const t = m[2] != null ? +m[1] * 60 + +m[2] : +m[1];
    s.results[st.id] = Object.assign({}, r || {}, { t: Math.min(t, TOTAL_T), g: (r && r.g) || s.groups[st.id] || '', manual: true });
    commit();
  },
  exportSession() {
    const C = curClass(), s = curSession(), T = buildSheetTables();
    const key = s.type === 'vma' ? 'Résultats VMA' : 'Résultats Fractionné';
    const rows = [T[key][0]].concat(T[key].slice(1).filter(r => r[0] === C.name && r[s.type === 'vma' ? 3 : 2] === fmtDate(s.date)));
    // tri alphabétique
    rows.splice(1, rows.length, ...rows.slice(1).sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'fr')));
    exportXLSX(`${s.type === 'vma' ? 'TestVMA' : 'Fractionne'}_${C.name}_${s.date}`, [{ name: s.type === 'vma' ? 'Test VMA' : 'Fractionné', rows }]);
  },
  exportClass() {
    const C = curClass(), T = buildSheetTables();
    exportXLSX('Endurance_' + C.name + '_' + todayISO(), Object.keys(T).map(k => ({ name: k, rows: [T[k][0]].concat(T[k].slice(1).filter(r => r[0] === C.name)) })));
  },
  /* --- Fractionné --- */
  fracSet(el) { curSession()[el.dataset.k] = +el.dataset.v; commit(); },
  fracReps(el) { const s = curSession(); s.reps = Math.max(1, Math.min(30, s.reps + +el.dataset.v)); commit(); },
  fracRole(el) {
    const s = curSession(), id = el.dataset.id, v = el.dataset.v;
    if (v === 'X') { delete s.roles[id]; const p = s.partner[id]; if (p) delete s.partner[p]; delete s.partner[id]; }
    else s.roles[id] = v;
    commit();
  },
  fracAllRole(el) { const s = curSession(); s.roles = {}; s.partner = {}; commit(); },
  fracAlt() { const s = curSession(); sortedStudents(curClass()).forEach((st, i) => s.roles[st.id] = i % 2 ? 'O' : 'C'); commit(); },
  fracSwap() {
    const s = curSession();
    Object.keys(s.roles).forEach(id => { s.roles[id] = s.roles[id] === 'C' ? 'O' : s.roles[id] === 'O' ? 'C' : s.roles[id]; });
    commit(); toast('Rôles inversés : les observateurs deviennent coureurs');
  },
  fracPairs() {
    const C = curClass(), s = curSession();
    const v = st => fracVMA(C, s, st.id) || 0;
    const R = sortedStudents(C).filter(st => s.roles[st.id] === 'C').sort((a, b) => v(b) - v(a));
    const O = sortedStudents(C).filter(st => s.roles[st.id] === 'O').sort((a, b) => v(b) - v(a));
    s.partner = {};
    for (let i = 0; i < Math.min(R.length, O.length); i++) { s.partner[R[i].id] = O[i].id; s.partner[O[i].id] = R[i].id; }
    commit();
    toast(R.length === O.length ? 'Binômes formés (VMA proches)' : `Binômes formés — ${Math.abs(R.length - O.length)} élève(s) sans binôme`);
  },
  fracVal(el) {
    const s = curSession(), id = el.dataset.id, i = +el.dataset.i;
    const arr = s.valid[id] || (s.valid[id] = []);
    while (arr.length <= i) arr.push(null);
    arr[i] = arr[i] == null ? 1 : arr[i] === 1 ? 0 : null;
    commit();
  },
  fracGo() {
    if (live) { toast('Un chrono est déjà en cours'); return; }
    const C = curClass(), s = curSession();
    unlockSpeech();
    live = { kind: 'frac', cls: C.name, sid: s.id, tl: null };
    const end = (s.reps - 1) * (s.work + s.rest) + s.work + 3;
    live.tl = new Timeline(fracEvents(s), { lead: 6, end, onTick: fracTick, onEnd: () => { live = null; keepAwake(false); render(); toast('🏁 Série terminée'); } });
    live.tl.start(); keepAwake(true); render();
  },
  fracPause() {
    if (!live || !live.tl) return;
    if (live.tl.paused) { live.tl.resume(); $('#lv-pause').textContent = '⏸ Pause'; }
    else { live.tl.pause(); $('#lv-pause').textContent = '▶ Reprendre'; }
  },
  fracStop() {
    if (!confirm('Arrêter le chrono ?')) return;
    live.tl.stop(); live = null; keepAwake(false); render();
  }
};

const CHG = {
  sheetUrl(el) { cfg.sheetUrl = el.value.trim() || DEFAULT_SHEET; saveCfg(); },
  scriptUrl(el) { cfg.scriptUrl = el.value.trim() || SCRIPT_URL; saveCfg(); if (cfg.scriptUrl) { pullRemote(); ACT.loadTabs(null, true); } else setSync('local'); render(); },
  pickTab(el) {
    const n = el.dataset.name; el.checked ? ui.picked.add(n) : ui.picked.delete(n);
    const b = $('#importBtn'); if (b) b.textContent = '⬇ Importer la sélection (' + ui.picked.size + ')';
  },
  restore(el) {
    const f = el.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const o = JSON.parse(rd.result);
        if (!o || !o.classes) throw new Error();
        if (!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
        state = o; commit(); toast('Sauvegarde restaurée');
      } catch (e) { toast('Fichier de sauvegarde invalide'); }
    };
    rd.readAsText(f);
  },
  sessDate(el) { curSession().date = el.value || todayISO(); commit(); },
  fracPct(el) { curSession().pct = +el.value; commit(); },
  fracVma(el) {
    const s = curSession(), v = parseNum(el.value);
    if (v == null) delete s.vmaOv[el.dataset.id]; else s.vmaOv[el.dataset.id] = v;
    commit();
  },
  fracPartner(el) {
    const s = curSession(), a = el.dataset.id, b = el.value;
    const unlink = x => { const p = s.partner[x]; if (p) delete s.partner[p]; delete s.partner[x]; };
    unlink(a); if (b) { unlink(b); s.partner[a] = b; s.partner[b] = a; }
    commit();
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]');
  if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newTab') ACT.addTab();
  if (e.key === 'Enter' && e.target.id === 'newStName') ACT.addStudent();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (live && live.tl) { keepAwake(true); if (Snd.ctx && Snd.ctx.state !== 'running') Snd.ctx.resume(); }
  else pullRemote();
});
window.addEventListener('afterprint', () => { $('#print-root').innerHTML = ''; });
window.addEventListener('beforeunload', e => { if (live && live.tl) { e.preventDefault(); e.returnValue = ''; } });
setInterval(() => { if (!live && document.visibilityState === 'visible') pullRemote(); }, 120000);

/* Démarrage : affichage de la version locale puis récupération de la version la plus récente */
render();
if (cfg.scriptUrl) { pullRemote(); ACT.loadTabs(null, true); } else setSync('local');
</script>
</body>
</html>
